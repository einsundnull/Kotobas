plugins {
    id 'com.android.application'
}

android {
    signingConfigs {
        release {
            storePassword 'kotobas'
            keyPassword 'kotobas'
            keyAlias 'key0'
            storeFile file('/home/matthias/Desktop')
        }
    }
    compileSdk 32

    defaultConfig {
        applicationId "com.notorein.JapaneseVocabulary"
        minSdk 26
        targetSdk 29
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.verbs.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            versionNameSuffix '1'
        }
        applicationVariants.all{
                // this method is use to rename your all apk weather
// it may be signed or unsigned(debug apk)
            variant ->
                variant.outputs.each{
                        // on below line we are setting
// a name to our apk as GFG.apk
                    output->
// on below line we are adding version name to
// our .apk file along with the app name
                        def name = "Japanese Vocabulary V${variant.versionName}.apk"
// on below line we are setting the
// outputFile Name to our apk file
                        output.outputFileName = name
                }}
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildToolsVersion '31.0.0'
    buildFeatures {
        viewBinding true
    }
    namespace 'com.notorein.BasicApp'
}

dependencies {

    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    implementation 'com.intellij:annotations:+@jar'
//implementation     'org.javafxports:jfxmobile-plugin:2.0.8'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'com.android.support:support-annotations:28.0.0'

    implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '3.17'
    implementation group: 'org.apache.xmlbeans', name: 'xmlbeans', version: '3.1.0'
    implementation 'javax.xml.stream:stax-api:1.0'
    implementation 'com.fasterxml:aalto-xml:1.2.2'
    implementation 'com.google.firebase:firebase-database:20.0.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.verbs.ext:junit:1.1.3'
//    androidTestImplementation 'androidx.verbs.espresso:espresso-core:3.4.0'
}

